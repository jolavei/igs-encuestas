name: Sync Neon -> BigQuery

# Copia las tablas de Neon a BigQuery por batch.
on:
  schedule:
    # 04/10/16/22 UTC = 00:00, 06:00, 12:00 y 18:00 en Chile (UTC-4).
    # GitHub solo acepta UTC y no ajusta el horario de verano: entre septiembre y abril
    # (UTC-3) estas corridas caen a las 01, 07, 13 y 19 hora local.
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Sincronizar a BigQuery
        run: node scripts/sync-bigquery.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BQ_DATASET: raw_postgres
          BQ_LOCATION: US

      # Histórico de tiempos desde los Google Sheets (Google Forms IQQ/CJC/PMC).
      # Deja tiempos_procesos.mediciones_sheets al día ANTES de correr Dataform.
      - name: Consolidar Google Sheets de tiempos -> BigQuery
        run: node scripts/sync-sheets-tiempos.mjs
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BQ_DATASET: tiempos_procesos
          BQ_LOCATION: US

      # Con los datos crudos ya al día, Dataform reconstruye las tablas anchas.
      - name: Autenticar en Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Ejecutar Dataform
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: us-central1
          REPO: igs-encuestas
          BRANCH: main
        run: |
          set -euo pipefail
          API="https://dataform.googleapis.com/v1beta1/projects/$PROJECT/locations/$REGION/repositories/$REPO"

          # 1. Compila la rama por defecto (lo que esté commiteado, no el workspace).
          COMPILATION=$(curl -sS -X POST "$API/compilationResults" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"gitCommitish\":\"$BRANCH\"}" | jq -r '.name // empty')

          if [ -z "$COMPILATION" ]; then
            echo "No se pudo compilar el repo Dataform (revisa permisos o errores de compilación)."
            exit 1
          fi
          echo "Compilación: $COMPILATION"

          # 2. Ejecuta solo las acciones etiquetadas 'encuestas' (las tablas por cuestionario).
          curl -sS -X POST "$API/workflowInvocations" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"compilationResult\":\"$COMPILATION\",\"invocationConfig\":{\"includedTags\":[\"encuestas\"]}}" \
            | jq -r '.name, .state'
