name: Sync Neon -> BigQuery

# Copia las tablas de Neon a BigQuery por batch.
on:
  schedule:
    # 04/10/16/22 UTC = 00:00, 06:00, 12:00 y 18:00 en Chile (UTC-4).
    # GitHub solo acepta UTC y no ajusta el horario de verano: entre septiembre y abril
    # (UTC-3) estas corridas caen a las 01, 07, 13 y 19 hora local.
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Sincronizar a BigQuery
        run: node scripts/sync-bigquery.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BQ_DATASET: raw_postgres
          BQ_LOCATION: US

      # Histórico de tiempos desde los Google Sheets (Google Forms IQQ/CJC/PMC).
      # Deja tiempos_procesos.mediciones_sheets al día ANTES de correr Dataform.
      - name: Consolidar Google Sheets de tiempos -> BigQuery
        run: node scripts/sync-sheets-tiempos.mjs
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BQ_DATASET: tiempos_procesos
          BQ_LOCATION: US

      # Con los datos crudos ya al día, Dataform reconstruye las tablas anchas.
      - name: Autenticar en Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Ejecutar Dataform
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: us-central1
          REPO: igs-encuestas
          BRANCH: main
        run: |
          set -euo pipefail
          BASE="https://dataform.googleapis.com/v1beta1"
          API="$BASE/projects/$PROJECT/locations/$REGION/repositories/$REPO"
          auth=(-H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")

          # 1. Compila la rama por defecto (lo que esté commiteado, no el workspace).
          COMP_RESP=$(curl -sS -X POST "$API/compilationResults" "${auth[@]}" \
            -d "{\"gitCommitish\":\"$BRANCH\"}")
          COMPILATION=$(echo "$COMP_RESP" | jq -r '.name // empty')
          if [ -z "$COMPILATION" ]; then
            echo "No se pudo crear la compilación. Respuesta:"
            echo "$COMP_RESP" | jq .
            exit 1
          fi
          echo "Compilación: $COMPILATION"

          # 1b. Una compilación puede devolver nombre y AUN ASÍ traer errores de código
          #     (p.ej. un ref() sin resolver). En ese caso no se puede invocar: aborta claro.
          CERR=$(curl -sS "$BASE/$COMPILATION" "${auth[@]}" -X GET \
            | jq -r '.compilationErrors // [] | length')
          if [ "${CERR:-0}" != "0" ]; then
            echo "La compilación de '$BRANCH' tiene $CERR error(es) de código:"
            curl -sS "$BASE/$COMPILATION" "${auth[@]}" -X GET \
              | jq -r '.compilationErrors[] | "- \(.message)  [\(.actionTarget.name // "?")]"'
            echo "Revisa que sources_tiempos.js y los .sqlx estén todos en la rama '$BRANCH'."
            exit 1
          fi

          # 2. Ejecuta solo las acciones etiquetadas 'encuestas' (+ sus dependencias).
          INV_RESP=$(curl -sS -X POST "$API/workflowInvocations" "${auth[@]}" \
            -d "{\"compilationResult\":\"$COMPILATION\",\"invocationConfig\":{\"includedTags\":[\"encuestas\"],\"transitiveDependenciesIncluded\":true}}")
          INVOCATION=$(echo "$INV_RESP" | jq -r '.name // empty')
          if [ -z "$INVOCATION" ]; then
            echo "No se pudo crear la invocación. Respuesta:"
            echo "$INV_RESP" | jq .
            exit 1
          fi
          echo "Invocación: $INVOCATION"

          # 3. Espera a que termine y falla si no queda en SUCCEEDED.
          for _ in $(seq 1 60); do
            STATE=$(curl -sS "$BASE/$INVOCATION" "${auth[@]}" -X GET | jq -r '.state')
            echo "Estado: $STATE"
            case "$STATE" in
              SUCCEEDED) echo "Dataform reconstruyó las tablas correctamente."; exit 0 ;;
              FAILED|CANCELLED|CANCELING)
                echo "La invocación terminó en $STATE. Detalle por acción:"
                curl -sS "$BASE/$INVOCATION:query" "${auth[@]}" -X GET \
                  | jq -r '.workflowInvocationActions[]? | "- \(.target.name): \(.state) \(.failureReason // "")"'
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timeout esperando a Dataform (sigue en $STATE)."
          exit 1
